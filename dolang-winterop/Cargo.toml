[package]
name = "dolang-winterop"
version = "0.1.1"
description = "Portable Windows security-descriptor/SID/GUID primitives."
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
test = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[dependencies]
phf = { version = "0.14.0", features = ["macros"] }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
futures = "0.3.31"

[dev-dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }
