[package]
name = "dolang-ext-uuid"
version = "0.1.1"
description = "UUID extension for the Do language."
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
test = false
doctest = false

[dependencies]
uuid = { version = "1", features = ["v4"] }

[dependencies.dolang]
path = "../dolang"
version = "0.1.1"

[dependencies.dolang-winterop]
path = "../dolang-winterop"
version = "0.1.1"
