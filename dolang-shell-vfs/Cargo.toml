[package]
name = "dolang-shell-vfs"
version = "0.1.1"
description = "Shell VFS daemon for Do language integrations."
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22.1"
dolang-rpc = { path = "../dolang-rpc", version = "0.1.1" }
dolang-vfs = { path = "../dolang-vfs", version = "0.1.1" }
tokio = { version = "1.48.0", features = ["io-std", "io-util", "macros", "net", "rt", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["fs", "user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Environment", "Win32_System_Registry", "Win32_UI_Shell"] }
