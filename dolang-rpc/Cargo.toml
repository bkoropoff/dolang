[package]
name = "dolang-rpc"
version = "0.1.1"
edition = "2024"
description = "Asynchronous RPC with native handle passing on Unix and Windows."
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1.8.2"
bytes = "1"
dolang-util = { package = "dolang-private-util", path = "../dolang-private-util", version = "0.1.1" }
futures = "0.3.31"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["fs", "socket", "uio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
ctor = { version = "0.2", optional = true }

[features]
default = ["macos-spawn-interpose"]
# Interposes posix_spawn/posix_spawnp on macOS to atomically close the
# SCM_RIGHTS FD_CLOEXEC race (see issue #384). Disable only if the embedding
# host process already performs its own posix_spawn interposition (e.g. a
# sanitizer or another embedded runtime) -- two interposers targeting the
# same DYLD_INTERPOSE section can conflict. Disabling this reopens the exact
# race it closes.
macos-spawn-interpose = ["dep:ctor"]
debug = ["dolang-util/debug"]

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security"] }

[[bench]]
name = "pipe_trailer"
harness = false

[[bench]]
name = "pipe_raw"
harness = false
