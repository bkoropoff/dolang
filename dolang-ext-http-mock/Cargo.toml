[package]
name = "dolang-ext-http-mock"
version = "0.1.1"
description = "HTTP mock server extension for the Do language."
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[features]
default = ["json"]
json = ["dep:dolang-ext-json"]

[dependencies]
bstr = "1.12.1"
futures = "0.3.31"
http = "1"
httpdate = "1.0"
regex = "1"
url = "2"

[dependencies.tokio]
version = "1.48"
features = ["rt", "sync"]

[dependencies.wiremock]
version = "0.6"

[dependencies.dolang-ext-json]
path = "../dolang-ext-json"
version = "0.1.1"
optional = true

[dependencies.dolang-ext-url]
path = "../dolang-ext-url"
version = "0.1.1"

[dependencies.dolang-ext-shell]
path = "../dolang-ext-shell"
version = "0.1.1"

[dependencies.dolang]
path = "../dolang"
version = "0.1.1"
