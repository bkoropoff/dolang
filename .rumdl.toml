[global]
flavor = "mkdocs"
disable = ["MD040"]

[per-file-ignores]
# These links target rustdoc output generated alongside the MkDocs site.
"docs/rust-api.md" = ["MD057"]

[MD007]
indent = 4 # Unordered list indentation

[MD013]
line-length = 80
code-blocks = false
reflow = true
reflow-mode = "default"

[MD060]
enabled = true
style = "aligned"
max-width = 0
column-align = "auto"
