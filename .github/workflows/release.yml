name: Release

on:
  push:
    tags: ["v*", "bootstrap"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: 3

permissions:
  contents: read

defaults:
  run:
    shell: dolang --strict --no-cache --import dodo --import sys --import fs {0}

jobs:
  dist:
    name: Build Distribution
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.target == 'x86_64-freebsd' && 'dolang --strict --no-cache --import dodo --import sys --import fs -m libvirt --env PATH=/home/ci/.cargo/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin --env CARGO_TERM_COLOR --env FORCE_COLOR dolang-ci {0}' || 'dolang --strict --no-cache --import dodo --import sys --import fs {0}' }}
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
          - target: x86_64-windows
            os: windows-latest
          - target: aarch64-macos
            os: macos-latest
          - target: x86_64-freebsd
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Dolang
        id: dolang
        uses: ./.github/actions/setup-dolang

      - name: Install Rust toolchain
        if: matrix.target != 'x86_64-freebsd'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: matrix.target != 'x86_64-freebsd'
        uses: Swatinem/rust-cache@v2

      - name: Cache FreeBSD VM assets
        if: matrix.target == 'x86_64-freebsd'
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/dolang-freebsd-ci/libvirt/ssh
            ~/.local/share/dolang-freebsd-ci/libvirt/seeds
            ~/.cache/dolang-freebsd-ci
          key: freebsd-libvirt-v1
          restore-keys: |
            freebsd-libvirt-

      - name: Prereqs (FreeBSD)
        if: matrix.target == 'x86_64-freebsd'
        shell: dolang --strict --no-cache {0}
        run: |
          import proc sudo fs libvirt http
          sudo.with do
            run apt-get update
            run apt-get install -y
              libvirt-daemon-system libvirt-clients qemu-system-x86 qemu-utils
              passt cloud-image-utils openssh-client apparmor-utils
            run usermod -aG kvm,libvirt $env["USER"]
            fs.set_metadata mode: 0o666 /dev/kvm
            run sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            run sysctl -w kernel.unprivileged_userns_clone=1
            run systemctl stop apparmor.service
            run systemctl disable apparmor.service
            try
              run aa-teardown
            catch proc.Error: _
              nil

          let vm = libvirt.create
            image: https://download.freebsd.org/releases/VM-IMAGES/15.1-RELEASE/amd64/Latest/FreeBSD-15.1-RELEASE-amd64-BASIC-CLOUDINIT-ufs.qcow2.xz
            os: :FREEBSD:
            dolang: bootstrap
            name: dolang-ci
            app: dolang-freebsd-ci
            memory: 12288
            vcpus: 4
            disk_size: 100G
            packages:
              - sqlite3
              - pkgconf
              - curl
              - llvm19
            init:
              add:
                target: /etc/rc.conf.d/firstboot_pkg_upgrade
                content: |
                  firstboot_pkg_upgrade_enable="NO"
            run: do http.get https://sh.rustup.rs do |resp|
              run sh -s -- -y stdin: $resp.chunks()

          run tar -czf /tmp/dolang-src.tar.gz --exclude=.git --exclude=target .
          vm.upload /tmp/dolang-src.tar.gz /home/ci/dolang-src.tar.gz
          vm.with do
            run tar -xzf dolang-src.tar.gz
            run rm -f dolang-src.tar.gz

      - name: Prereqs (not FreeBSD)
        if: matrix.target != 'x86_64-freebsd'
        run: |
          import sudo fs sys
          let os = sys.os_info().os
          let env_file = env["GITHUB_ENV"]

          if (os == :WINDOWS:)
            fs.append $env_file |
              CARGO_PROFILE_DEV_DEBUG=0
              CARGO_PROFILE_TEST_DEBUG=0
          else if (os == :MACOS:)
            run brew install llvm
            fs.append $env_file |
              LIBCLANG_PATH=/opt/homebrew/opt/llvm/lib
          else if (os == :LINUX:)
            sudo.with do
              run apt update
              run apt install llvm libclang-dev
            run rustup target add x86_64-unknown-linux-musl

      - name: Build and install release binaries
        run: |
          dodo.run install --prefix release

      - name: Run integration tests
        run: |
          let is_win = (sys.os_info().family == :WINDOWS:)
          if is_win
            # Temporarily build polyfill binary and place it next to dolang
            dodo.run build -- --bin dolang-private-polyfill
            fs.copy
              target/x86_64-pc-windows-msvc/debug/dolang-private-polyfill.exe
              release/bin/dolang-private-polyfill.exe
          run release/bin/dolang --module-path testlib -m test -- test
          if is_win
            # Now remove it
            fs.remove release/bin/dolang-private-polyfill.exe

      - name: Package release (not FreeBSD)
        if: matrix.target != 'x86_64-freebsd'
        run: |
          import transfer
          transfer.pack release/bin "dolang-${{ matrix.target }}.tar.gz"

      - name: Package release and stop VM (FreeBSD)
        if: matrix.target == 'x86_64-freebsd'
        shell: dolang --strict --no-cache {0}
        run: |
          import libvirt
            fs:
              - glob

          let vm = libvirt.attach dolang-ci
          vm.with do cd release/bin do
            run tar -czf ../../dolang-${{ matrix.target }}.tar.gz ...(glob "*")
          vm.download dolang-${{ matrix.target }}.tar.gz dolang-${{ matrix.target }}.tar.gz
          vm.destroy()
          vm.undefine()

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dolang-${{ matrix.target }}
          path: dolang-${{ matrix.target }}.tar.gz

  vsix:
    name: Build VSIX
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Dolang
        id: dolang
        uses: ./.github/actions/setup-dolang

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dolang-code/package-lock.json

      - name: Install extension dependencies
        working-directory: dolang-code
        run: run npm ci

      - name: Build extension
        working-directory: dolang-code
        run: run npm run compile

      - name: Run extension tests
        working-directory: dolang-code
        run: run xvfb-run -a npm test

      - name: Build release VSIX
        working-directory: dolang-code
        run: run npm run package:vsix

      - name: Upload release VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: dolang-vsix
          path: dolang-code/*.vsix

  create-release:
    name: Create Release
    if: github.ref_type == 'tag' && (github.ref_name == 'bootstrap' || startsWith(github.ref_name, 'v'))
    needs: [dist, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Dolang
        id: dolang
        uses: ./.github/actions/setup-dolang

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract version from tag
        run: |
          import fs
          fs.append $env["GITHUB_ENV"] |
            VERSION=$(env["GITHUB_REF"].without_prefix "refs/tags/")

      - name: Create draft release
        if: startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ env.VERSION }}
          prerelease: true
          draft: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create bootstrap release
        if: github.ref_name == 'bootstrap'
        uses: softprops/action-gh-release@v2
        with:
          name: Bootstrap
          prerelease: true
          files: |
            artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
