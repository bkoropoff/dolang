name: Release

on:
  push:
    tags: ["v*", "bootstrap"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: 3

permissions:
  contents: read

defaults:
  run:
    shell: dolang-ci {0}

jobs:
  dist:
    name: Build Distribution
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-22.04
          - target: aarch64-linux
            os: ubuntu-24.04-arm
          - target: x86_64-windows
            os: windows-latest
          - target: aarch64-windows
            os: windows-11-arm
          - target: aarch64-macos
            os: macos-latest
          - target: x86_64-freebsd
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup runner
        uses: ./.github/actions/setup-runner
        with:
          target: ${{ matrix.target }}
          virt: ${{ matrix.target == 'x86_64-freebsd' }}

      - name: Build and install release binaries
        run: |
          dodo.run install --prefix release

      - name: Verify macOS posix_spawn interpose survived linking
        if: matrix.target == 'aarch64-macos'
        run: |
          dodo.run verify-macos-interpose --bin release/bin/dolang

      - name: Run integration tests
        run: |
          let is_win = (sys.os_info().family == :WINDOWS:)
          if is_win
            # Temporarily build polyfill binary and place it next to dolang
            dodo.run build -- --bin dolang-private-polyfill
            fs.copy
              target/$((str $ sys.cpu_info().arch).lower())-pc-windows-msvc/debug/dolang-private-polyfill.exe
              release/bin/dolang-private-polyfill.exe
          run release/bin/dolang --module-path testlib -m test --tags !release test
          if is_win
            # Now remove it
            fs.remove release/bin/dolang-private-polyfill.exe

      - name: Package release (host)
        if: matrix.target != 'x86_64-freebsd'
        run: |
          import transfer
          transfer.pack release/bin "dolang-${{ matrix.target }}.tar.gz"

      - name: Package release (CI VM)
        if: matrix.target == 'x86_64-freebsd'
        shell: dolang-ci --host {0}
        run: |
          import libvirt
            fs:
              - glob

          let vm = libvirt.attach dolang-ci
          vm.with do cd release/bin do
            run tar -czf ../../dolang-${{ matrix.target }}.tar.gz ...(glob "*")
          vm.download dolang-${{ matrix.target }}.tar.gz dolang-${{ matrix.target }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dolang-${{ matrix.target }}
          path: dolang-${{ matrix.target }}.tar.gz

  vsix:
    name: Build VSIX
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build VSIX
        uses: ./.github/actions/build-vsix
        with:
          upload: true

  release-tests:
    name: Release Integration
    needs: dist
    # Not `ubuntu-latest`, which is still 24.04 and so libvirt 10.0: the vTPM
    # state directory is chosen with `<tpm><backend><source>`, which libvirt
    # only understands from 10.10.0 on. An older one ignores the element and
    # keeps the state somewhere of its own choosing, so a Windows guest
    # installs fine and then exports a bundle with no vTPM in it. 26.04 has
    # libvirt 12.0. Revert to `ubuntu-latest` once that points at 26.04.
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup runner
        uses: ./.github/actions/setup-runner
        with:
          rust: false
          virt: true

      - name: Download x86-64 artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: dolang-x86_64-*
          path: artifacts
          merge-multiple: true

      # Windows media is not redistributable, so the unattended-install test
      # runs only against media someone points it at. Nothing about those URLs
      # is stable: the Evaluation Center hands out `go.microsoft.com` fwlinks
      # whose `linkid` changes with every media refresh, and the virtio ISO's
      # "stable" URL is a redirector whose target moves with each driver
      # release. So both are scraped and resolved here, at the start of the
      # job, rather than pinned in the repository where they would rot
      # silently into a 404 months after anyone last looked.
      #
      # Resolving the redirects rather than handing the redirector to
      # `transfer.get` is load-bearing twice over: the download cache is keyed
      # on the URL, so an unresolved fwlink would cache one build of the media
      # under a name that later means a different one, and the fwlink has no
      # path leaf for the cache to name the payload after in the first place.
      - name: Resolve Windows install media
        id: windows-media
        run: |
          import http regex std

          let page_url = "https://www.microsoft.com/en-us/evalcenter/download-windows-11-enterprise"
          # The anchor's `aria-label` is the link's visible text, and the only
          # durable handle on the page — the `linkid`, the surrounding markup
          # and the marketing tags all move around. The LTSC link's label
          # reads "... Enterprise ISO LTSC 64-bit (en-US)", so it does not
          # match this and the plain Enterprise evaluation media wins.
          let link = regex.Regex r#"<a[^>]*aria-label="[^"]*Windows 11 Enterprise ISO 64-bit \(en-US\)"[^>]*href="(https://go\.microsoft\.com/fwlink/[^"]+)""#
          let page = http.get $page_url do |resp| resp.text()
          let found = link.match $page
          if !found
            throw std.ValueError "no Windows 11 Enterprise en-US 64-bit ISO link on $page_url"

          def resolve url
            http.head $url do |resp| resp.url

          let installer = resolve $ str $found[1]
          let drivers = resolve
            "https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso"
          echo "installer: $installer"
          echo "drivers:   $drivers"
          fs.append $env["GITHUB_ENV"] |
            DOLANG_LIBVIRT_TEST_WINDOWS_INSTALLER=$installer
            DOLANG_LIBVIRT_TEST_WINDOWS_DRIVERS=$drivers

      - name: Run release integration tests
        run: |
          import fs:
            - Path

          let bin = Path("release-test-bin").absolute()
          bin.create_dir all: true
          run tar -xzf artifacts/dolang-x86_64-linux.tar.gz -C $bin
          let archive = Path("artifacts/dolang-x86_64-freebsd.tar.gz").absolute()
          # The Windows guest runs the Windows build, not the host's own.
          let windows = Path("artifacts/dolang-x86_64-windows.tar.gz").absolute()
          env DOLANG_LIBVIRT_TEST_ARCHIVE: $archive
            DOLANG_LIBVIRT_TEST_WINDOWS_ARCHIVE: $windows
            do
              run $bin/dolang --module-path testlib -m test --tags release --timeout 3600 test

  create-release:
    name: Create Release
    if: github.ref_type == 'tag' && (github.ref_name == 'bootstrap' || startsWith(github.ref_name, 'v'))
    needs: [dist, vsix, release-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup runner
        uses: ./.github/actions/setup-runner
        with:
          rust: false

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract version from tag
        run: |
          fs.append $env["GITHUB_ENV"] |
            VERSION=$(env["GITHUB_REF"].without_prefix "refs/tags/")

      - name: Create draft release
        if: startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ env.VERSION }}
          prerelease: true
          draft: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download previous bootstrap release
        id: previous-bootstrap
        if: github.ref_name == 'bootstrap'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import proc

          let exists = try
            run gh release view bootstrap
            true
          catch proc.Error: _
            false
          if exists
            run gh release download bootstrap --dir bootstrap-prev
          fs.append $env["GITHUB_OUTPUT"] |
            exists=$exists

      - name: Back up previous bootstrap release
        if: github.ref_name == 'bootstrap' && steps.previous-bootstrap.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bootstrap-prev
          name: Previous Bootstrap
          prerelease: true
          files: |
            bootstrap-prev/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create bootstrap release
        if: github.ref_name == 'bootstrap'
        uses: softprops/action-gh-release@v2
        with:
          name: Bootstrap
          prerelease: true
          files: |
            artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
