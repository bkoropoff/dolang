name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: 3

permissions:
  contents: read

defaults:
  run:
    shell: dolang-ci {0}

jobs:
  regression:
    name: Regression
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
          - target: x86_64-windows
            os: windows-latest
          - target: aarch64-macos
            os: macos-latest
          - target: x86_64-freebsd
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup runner
        id: setup
        uses: ./.github/actions/setup-runner
        with:
          target: ${{ matrix.target }}
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      # Skipped in the VM: `clippy --all-targets` compiles the whole dependency
      # graph again without producing anything `cargo test` can reuse, so it
      # costs a second cold build to re-check lints that the other three
      # targets already cover.
      - name: Lint
        if: matrix.target != 'x86_64-freebsd'
        run: dodo.run lint

      - name: Run tests
        run: dodo.run test

      # Runs on the runner rather than in the VM, and before teardown: the
      # domain disk drops guest flushes, so the caches have to be copied out
      # while it is still up. Skipped outside master, where nothing would
      # ever restore a saved cache (see `save-cache` on the setup-runner
      # action), and on an exact cache hit, where there's nothing new to pack.
      - name: Pack build cache
        if: >
          always() && matrix.target == 'x86_64-freebsd' &&
          github.ref == 'refs/heads/master' &&
          steps.setup.outputs.vm-cache-hit != 'true'
        shell: dolang --strict --no-cache --module-path .github/actions/setup-runner/lib {0}
        run: |
          import ci
          ci.save_cache()

      # The counterpart to "Restore CI VM build cache" in the setup-runner
      # action: that step only restores, so persisting what "Pack build
      # cache" just produced is this workflow's job, once it exists.
      - name: Save build cache
        if: >
          always() && matrix.target == 'x86_64-freebsd' &&
          github.ref == 'refs/heads/master' &&
          steps.setup.outputs.vm-cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/dolang-freebsd-cache
          key: freebsd-cargo-v2-${{ hashFiles('Cargo.lock') }}

  extension:
    name: VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build VSIX
        uses: ./.github/actions/build-vsix

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup runner
        uses: ./.github/actions/setup-runner
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prereqs
        run: |
          run python -m pip install --requirement docs/requirements.txt
          run cargo install rumdl

      - name: Lint docs
        run: dodo.run lint-docs

      - name: Build docs site
        run: dodo.run mkdocs --target x86_64-linux

      - name: Build Rust API docs
        run: dodo.run rustdoc
