name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: 3

permissions:
  contents: read

defaults:
  run:
    shell: dolang-ci {0}

jobs:
  regression:
    name: Regression
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
          - target: x86_64-windows
            os: windows-latest
          - target: aarch64-macos
            os: macos-latest
          - target: x86_64-freebsd
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup runner
        uses: ./.github/actions/setup-runner
        with:
          target: ${{ matrix.target }}

      - name: Lint
        run: dodo.run lint

      - name: Run tests
        run: dodo.run test

  extension:
    name: VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build VSIX
        uses: ./.github/actions/build-vsix

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup runner
        uses: ./.github/actions/setup-runner

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prereqs
        run: |
          run python -m pip install --requirement docs/requirements.txt
          run cargo install rumdl

      - name: Lint docs
        run: dodo.run lint-docs

      - name: Build docs site
        run: dodo.run mkdocs --target x86_64-linux
